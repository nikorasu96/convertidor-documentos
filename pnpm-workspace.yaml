# Forzamos lodash >=4.18.1 (transitivo vía xlsx-populate) para cerrar
# CVE de code injection (_.template) y prototype pollution (_.unset/_.omit).
overrides:
  lodash@<4.18.1: 4.18.1

allowBuilds:
  esbuild: true

ignoredBuiltDependencies:
  - sharp

# Reducido temporalmente para instalar parches de seguridad CVE-2025-55184
minimumReleaseAge: 720
